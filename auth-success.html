<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clonix | Login Success</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="assets/Clonix-No-Background.png" alt="Clonix Logo">
                    <h1>Clonix</h1>
                </div>
            </div>

            <div id="successContent">
                <div style="text-align: center; padding: 2rem;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">#x1F389;</div>
                    <h2 style="color: #0f172a; margin-bottom: 1rem;">Login Successful!</h2>
                    <p style="color: #64748b; margin-bottom: 2rem;">Redirecting to dashboard...</p>
                    <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top: 3px solid #ff9066; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
            </div>

            <div id="errorContent" style="display: none;">
                <div style="text-align: center; padding: 2rem;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">#x274C;</div>
                    <h2 style="color: #dc2626; margin-bottom: 1rem;">Login Failed</h2>
                    <p style="color: #64748b; margin-bottom: 2rem;">There was an error with Google login. Please try again.</p>
                    <button class="auth-btn" onclick="goBack()">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                token: params.get('token'),
                user: params.get('user'),
                error: params.get('error')
            };
        }

        function goBack() {
            window.location.href = 'auth.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = getUrlParams();
            const successContent = document.getElementById('successContent');
            const errorContent = document.getElementById('errorContent');
            
            // DEBUG: Log all parameters
            console.log('=== AUTH SUCCESS DEBUG ===');
            console.log('URL:', window.location.href);
            console.log('Token:', params.token ? 'Present (length: ' + params.token.length + ')' : 'MISSING');
            console.log('User:', params.user ? 'Present' : 'MISSING');
            console.log('Error:', params.error);
            console.log('===========================');

            if (params.error) {
                console.error('Error parameter found:', params.error);
                successContent.style.display = 'none';
                errorContent.style.display = 'block';
            } else if (params.token && params.user) {
                try {
                    console.log('Parsing user data...');
                    const user = JSON.parse(decodeURIComponent(params.user));
                    console.log('User parsed successfully:', user);
                    
                    // Store auth data
                    console.log('Storing token in localStorage...');
                    localStorage.setItem('authToken', params.token);
                    console.log('Storing user in sessionStorage...');
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    console.log('Data stored successfully!');
                    
                    // Show success and redirect
                    console.log('Redirecting to index.html in 2 seconds...');
                    setTimeout(() => {
                        console.log('Redirecting now to index.html');
                        window.location.href = 'index.html';
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error parsing user data:', error);
                    successContent.style.display = 'none';
                    errorContent.style.display = 'block';
                }
            } else {
                console.error('Missing token or user parameter');
                successContent.style.display = 'none';
                errorContent.style.display = 'block';
            }
        });
    </script>
</body>
</html>
